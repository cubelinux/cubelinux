id = "vshell"
packages = ["dnsmasq", "konsole", "lxc", "lxc-templates", "qt6-qtsvg", "shadow-utils"]
services = ["lxc-net.service"]

[[files]]
source = "src/cubelinux_vshell"
destination = "/usr/lib/cubelinux-vshell/cubelinux_vshell"
mode = "0644"

[[downloads]]
url = "https://pub-eb590fbfc3074776ad4199c13b93d722.r2.dev/logo/third-party/fedora-icon.svg"
destination = "/usr/lib/cubelinux-vshell/cubelinux_vshell/qml/fedora-icon.svg"
mode = "0644"

[[files]]
source = "bin/cubelinux-vshell"
destination = "/usr/bin/cubelinux-vshell"
mode = "0755"

[[files]]
source = "bin/cubelinux-vshell-host-setup"
destination = "/usr/libexec/cubelinux-vshell-host-setup"
mode = "0755"

[[files]]
source = "bin/cubelinux-vshell-launcher-sync"
destination = "/usr/libexec/cubelinux-vshell-launcher-sync"
mode = "0755"

[[files]]
source = "bin/cubelinux-vshell-useradd-hook"
destination = "/etc/shadow-maint/useradd-post.d/80-cubelinux-vshell"
mode = "0755"

[[files]]
source = "data/org.cubelinux.VShell.desktop"
destination = "/usr/share/applications/org.cubelinux.VShell.desktop"

[[files]]
source = "data/org.cubelinux.VShellTerminal.desktop"
destination = "/usr/share/applications/org.cubelinux.VShellTerminal.desktop"

[[files]]
source = "data/org.cubelinux.VShellAppDiscovery.desktop"
destination = "/etc/xdg/autostart/org.cubelinux.VShellAppDiscovery.desktop"

[[files]]
source = "data/VShell.profile"
destination = "/usr/share/konsole/VShell.profile"

[[files]]
source = "data/konsolerc"
destination = "/etc/xdg/konsolerc"

[[files]]
source = "data/lxc-sysconfig"
destination = "/etc/sysconfig/lxc"

[[files]]
source = "data/cubelinux-vshell.zone.xml"
destination = "/usr/lib/firewalld/zones/cubelinux-vshell.xml"

[[files]]
source = "data/vshell-egress.policy.xml"
destination = "/usr/lib/firewalld/policies/vshell-egress.xml"

[[files]]
source = "data/org.cubelinux.VShell.LxcSetup.policy"
destination = "/usr/share/polkit-1/actions/org.cubelinux.VShell.LxcSetup.policy"

[[files]]
source = "data/org.cubelinux.VShell.LauncherSync.policy"
destination = "/usr/share/polkit-1/actions/org.cubelinux.VShell.LauncherSync.policy"
