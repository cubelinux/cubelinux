name: Build and publish bootc image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'cubelinux-image/**'
      - 'cubelinux-updater/**'
      - 'cubelinux-vshell/**'
      - '.github/workflows/image-and-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-image:
    name: Build and push customized bootc image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run image builder unit tests
        working-directory: cubelinux-image
        run: python -m unittest discover -s tests -v

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME,,}"
          tag="${tag//\//-}"
          tag="${tag//[^a-z0-9_.-]/-}"
          full_sha_tag="sha-${GITHUB_SHA}"
          short_sha_tag="sha-${GITHUB_SHA:0:7}"
          tags="${name}:${tag}"$'\n'"${name}:${full_sha_tag}"$'\n'"${name}:${short_sha_tag}"$'\n'"${name}:latest"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              for version_tag in "$version" "${major}.${minor}" "$major"; do
                if [[ "$version_tag" != "$tag" ]]; then
                  tags+=$'\n'"${name}:${version_tag}"
                fi
              done
            fi
          fi
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="${created%%T*}+${GITHUB_SHA:0:7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "staging_tag=${name}:${full_sha_tag}" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare image configuration and components
        id: packages
        working-directory: cubelinux-image
        run: python3 scripts/prepare_image.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify customized image
        uses: docker/build-push-action@v6
        with:
          context: ./cubelinux-image
          file: ./cubelinux-image/Containerfile
          push: true
          tags: ${{ steps.image.outputs.staging_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ steps.packages.outputs.base_image }}
            PACKAGES=${{ steps.packages.outputs.packages }}
            VSHELL_RUNTIME_IMAGE=ghcr.io/cubelinux/cubelinux-vshell-runtime:main
            VSHELL_RUNTIME_CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Release BuildKit cache storage
        run: |
          docker buildx prune --all --force
          df -h /

      - name: Install Podman tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman skopeo jq
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Rechunk image and publish final tags
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
          BASE_IMAGE: ${{ steps.packages.outputs.base_image }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          authfile="${RUNNER_TEMP}/containers-auth.json"
          digest_file="${RUNNER_TEMP}/cubelinux-image.digest"
          output_image="localhost/${IMAGE_NAME#ghcr.io/}:rechunk-${GITHUB_SHA}"

          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io \
            --authfile "$authfile" \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
          sudo podman pull --authfile "$authfile" "$STAGING_TAG"
          df -h /

          rechunk_args=(
            --max-layers=127
            --format-version=2
            --bootc
          )
          previous_image="${IMAGE_NAME}:latest"
          if sudo skopeo inspect --raw --authfile "$authfile" \
              "docker://${previous_image}" 2>/dev/null \
              | jq -e '[(.layers[1:] // [])[] | .annotations["ostree.components"]?] as $components | ($components | length > 0 and all(. != null))' \
              >/dev/null; then
            tool_help="$(sudo podman run --rm --privileged \
              --volume /var/lib/containers:/var/lib/containers \
              --entrypoint /usr/bin/rpm-ostree \
              "$BASE_IMAGE" compose build-chunked-oci --help)"
            if grep -q -- '--previous-build' <<< "$tool_help"; then
              rechunk_args+=(--previous-build "docker://${previous_image}")
            fi
          fi

          rechunk_args+=(
            "--from=${STAGING_TAG}"
            "--output=containers-storage:${output_image}"
          )

          sudo podman run --rm --privileged \
            --volume /var/lib/containers:/var/lib/containers \
            --volume "$authfile:/run/containers/auth.json:ro" \
            --env REGISTRY_AUTH_FILE=/run/containers/auth.json \
            --entrypoint /usr/bin/rpm-ostree \
            "$BASE_IMAGE" \
            compose build-chunked-oci \
              "${rechunk_args[@]}"

          sudo podman image rm --force "$STAGING_TAG" "$BASE_IMAGE" || true
          df -h /

          first_tag=true
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if [[ "$first_tag" == true ]]; then
              sudo podman push --authfile "$authfile" \
                --format oci \
                --compression-format zstd \
                --compression-level 10 \
                --digestfile "$digest_file" \
                "$output_image" "docker://${tag}"
              first_tag=false
            else
              sudo podman push --authfile "$authfile" \
                --format oci \
                --compression-format zstd \
                --compression-level 10 \
                "$output_image" "docker://${tag}"
            fi
          done <<< "$IMAGE_TAGS"

          echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

          sudo podman image rm --force "$output_image" || true
          sudo podman system prune --all --force --volumes
          sudo rm -f "$authfile" "$digest_file"
          df -h /

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: false
