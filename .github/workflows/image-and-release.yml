name: Build and publish bootc image

on:
  push:
    branches:
      - '**'
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push customized bootc image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out VShell
        uses: actions/checkout@v4
        with:
          repository: cubelinux/cubelinux-vshell
          ref: main
          path: vshell

      - name: Check out bootc updater
        uses: actions/checkout@v4
        with:
          repository: cubelinux/cubelinux-updater
          ref: main
          path: bootc-updater

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME,,}"
          tag="${tag//\//-}"
          tag="${tag//[^a-z0-9_.-]/-}"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="${created%%T*}+${GITHUB_SHA:0:7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read and validate package manifest
        id: packages
        shell: bash
        run: |
          ruby -ryaml -rjson -e '
            config = YAML.safe_load_file("packages.yml")
            packages = config.fetch("packages")
            abort "packages must be a non-empty list" unless packages.is_a?(Array) && !packages.empty?
            packages.each do |package|
              abort "invalid package name: #{package.inspect}" unless package.is_a?(String) && package.match?(/\A[A-Za-z0-9_.+-]+\z/)
            end
            distro = config.fetch("distro")
            abort "distro.os_release must be a mapping" unless distro.fetch("os_release").is_a?(Hash)
            abort "distro.logo.url must be an HTTPS URL" unless distro.fetch("logo").fetch("url").start_with?("https://")
            File.write("distro.json", JSON.generate(distro))
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts("packages=#{packages.join(" ")}") }
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push customized image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            PACKAGES=${{ steps.packages.outputs.packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
