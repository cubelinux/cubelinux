name: Build and publish bootc image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'cubelinux-image/**'
      - 'cubelinux-updater/**'
      - 'cubelinux-vshell/**'
      - '.github/workflows/image-and-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push customized bootc image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run image builder unit tests
        working-directory: cubelinux-image
        run: python -m unittest discover -s tests -v

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME,,}"
          tag="${tag//\//-}"
          tag="${tag//[^a-z0-9_.-]/-}"
          full_sha_tag="sha-${GITHUB_SHA}"
          short_sha_tag="sha-${GITHUB_SHA:0:7}"
          tags="${name}:${tag}"$'\n'"${name}:${full_sha_tag}"$'\n'"${name}:${short_sha_tag}"$'\n'"${name}:latest"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              for version_tag in "$version" "${major}.${minor}" "$major"; do
                if [[ "$version_tag" != "$tag" ]]; then
                  tags+=$'\n'"${name}:${version_tag}"
                fi
              done
            fi
          fi
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="${created%%T*}+${GITHUB_SHA:0:7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare image configuration and components
        id: packages
        working-directory: cubelinux-image
        run: python3 scripts/prepare_image.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, verify, and publish customized image
        uses: docker/build-push-action@v6
        with:
          context: ./cubelinux-image
          file: ./cubelinux-image/Containerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.packages.outputs.base_image }}
            PACKAGES=${{ steps.packages.outputs.packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
