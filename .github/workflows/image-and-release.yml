name: Build bootc image and release raw disk

on:
  push:
    branches:
      - '**'
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push customized bootc image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME,,}"
          tag="${tag//\//-}"
          tag="${tag//[^a-z0-9_.-]/-}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read and validate package manifest
        id: packages
        shell: bash
        run: |
          ruby -ryaml -e '
            packages = YAML.safe_load_file("packages.yml").fetch("packages")
            abort "packages must be a non-empty list" unless packages.is_a?(Array) && !packages.empty?
            packages.each do |package|
              abort "invalid package name: #{package.inspect}" unless package.is_a?(String) && package.match?(/\A[A-Za-z0-9_.+-]+\z/)
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts("packages=#{packages.join(" ")}") }
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push customized image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            PACKAGES=${{ steps.packages.outputs.packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-release-disk:
    name: Build and attach compressed raw disk
    if: github.event_name == 'release'
    needs: build-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Install Podman and Zstandard
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman zstd

      - name: Log in and pull release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.build-image.outputs.image }}:${{ needs.build-image.outputs.tag }}
          UPDATE_IMAGE: ${{ needs.build-image.outputs.image }}:main
        run: |
          printf '%s' "$GH_TOKEN" | sudo podman login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          sudo podman pull "$RELEASE_IMAGE"
          # Keep the release contents, but configure bootc to check the
          # moving main tag for subsequent updates.
          sudo podman tag "$RELEASE_IMAGE" "$UPDATE_IMAGE"

      - name: Build raw disk image
        env:
          UPDATE_IMAGE: ${{ needs.build-image.outputs.image }}:main
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p output
          sudo podman run --privileged --rm \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
            --bootc-ref "$UPDATE_IMAGE" \
            --bootc-default-fs ext4 \
            --output-dir /output \
            --output-name "fedora-bootc-${RELEASE_TAG}" \
            raw
          sudo chown -R "$(id -u):$(id -g)" output
          image="$(find output -type f -name '*.raw' -print -quit)"
          test -n "$image"
          zstd -T0 -19 "$image" -o "$image.zst"
          rm "$image"
          sha256sum "$image.zst" > "$image.zst.sha256"
          if [ "$(stat -c '%s' "$image.zst")" -ge 2000000000 ]; then
            echo 'Compressed image exceeds GitHub release asset size limit.' >&2
            exit 1
          fi

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.raw.zst
            output/*.raw.zst.sha256
