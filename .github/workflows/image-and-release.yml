name: Build and publish bootc image

on:
  push:
    branches:
      - '**'
    paths:
      - 'cubelinux-image/**'
      - 'cubelinux-updater/**'
      - 'cubelinux-vshell/**'
      - '.github/workflows/image-and-release.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push customized bootc image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run image builder unit tests
        working-directory: cubelinux-image
        run: python -m unittest discover -s tests -v

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME,,}"
          tag="${tag//\//-}"
          tag="${tag//[^a-z0-9_.-]/-}"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="${created%%T*}+${GITHUB_SHA:0:7}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare image configuration and components
        id: packages
        working-directory: cubelinux-image
        run: python3 scripts/prepare_image.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push customized image
        uses: docker/build-push-action@v6
        with:
          context: ./cubelinux-image
          file: ./cubelinux-image/Containerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ steps.packages.outputs.base_image }}
            PACKAGES=${{ steps.packages.outputs.packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Inspect the built image filesystem
        run: python cubelinux-image/scripts/verify_image.py --image "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"

      - name: Publish verified image
        run: docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
