[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubelinux-vshell"
version = "0.0.0"
description = "A KDE setup application and launcher for an LXC virtual shell"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.scripts]
cubelinux-vshell = "cubelinux_vshell.main:main"

[tool.setuptools.package-data]
cubelinux_vshell = ["qml/*.qml"]

[tool.setuptools.packages.find]
where = ["src"]
