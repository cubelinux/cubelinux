[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubelinux-updater"
version = "0.0.0"
description = "A KDE Plasma frontend for bootc image updates"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.scripts]
cubelinux-updater = "cubelinux_updater.main:main"

[tool.setuptools.package-data]
cubelinux_updater = ["qml/*.qml"]

[tool.setuptools.packages.find]
where = ["src"]
